name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore BunkerFlow.slnx

      - name: Build
        run: dotnet build BunkerFlow.slnx --configuration Release --no-restore

      # The broker-backed tests are a separate job: they start containers and
      # are an order of magnitude slower than this suite.
      - name: Test
        run: >-
          dotnet test tests/BunkerFlow.Integration.Tests/BunkerFlow.Integration.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  broker-tests:
    name: Broker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Drives the Kafka consumer against a real Redpanda container, so the
      # offset-commit rules are proved rather than assumed.
      - name: Test against a real broker
        run: >-
          dotnet test tests/BunkerFlow.Broker.Tests/BunkerFlow.Broker.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=broker-test-results.trx"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Init
        run: terraform init -backend=false -input=false
        working-directory: infra/terraform

      - name: Validate
        run: terraform validate -no-color
        working-directory: infra/terraform

  docker:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BunkerFlow.Api/Dockerfile
          push: false
          tags: bunkerflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BunkerFlow.Worker/Dockerfile
          push: false
          tags: bunkerflow-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
